# Micro-Manager configuration - Ti2 Cicerco, NIDAQ analog-output blanking
# Migrated from Ti2CicercoConfig_NIDAQ2.cfg
#
# Illumination is gated by NIDAQAOBlank-Dev1 (one combined AO blanking task,
# triggered by the camera exposure-out on Dev1/port0/line0).  This replaces the
# DA TTL Laser/LedDMD/LEDBright state devices and the per-line illumination
# NIDAQAO devices.  PiezoStage (ao18) is unchanged.
#
# The blanking device covers the contiguous block ao0..ao10 (First AO Line 0,
# Number of AO Lines 11).  Because the block is contiguous, State bit n = ao n.
#
# Channel map (AO line -> source -> State bit value):
#   ao0  violet laser      = 1
#   ao1  cyan laser        = 2
#   ao2  green laser       = 4
#   ao3  red laser         = 8        (all 4 lasers = 15)
#   ao4  violet LED        = 16
#   ao5  blue LED          = 32
#   ao6  cyan LED          = 64
#   ao7  teal LED          = 128
#   ao8  greenyellow LED   = 256
#   ao9  red LED           = 512
#   ao10 brightfield lamp  = 1024

